spring:
  datasource:
    url: jdbc:h2:mem:aps_priority_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

aps:
  priority:
    linkage-target: 50.00
  demo-data:
    enabled: true
