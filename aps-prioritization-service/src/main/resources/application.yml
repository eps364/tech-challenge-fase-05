spring:
  application:
    name: aps-prioritization-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5434/aps_priority_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:password}
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8205

aps:
  priority:
    linkage-target: ${APS_LINKAGE_TARGET:50.00}
  demo-data:
    enabled: ${APS_DEMO_DATA_ENABLED:true}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
