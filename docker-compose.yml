version: '3.9'

services:
  # ============================================================
  # INFRASTRUCTURE SERVICES
  # ============================================================

  # PostgreSQL Database for Keycloak
  keycloak-postgres:
    image: postgres:15-alpine
    container_name: keycloak-postgres
    environment:
      POSTGRES_DB: keycloak_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5430:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - susconnect-network

  # Keycloak Identity Provider
  keycloak:
    image: keycloak/keycloak:26.5.4
    container_name: keycloak
    depends_on:
      keycloak-postgres:
        condition: service_healthy
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-postgres:5432/keycloak_db
      KC_DB_USERNAME: postgres
      KC_DB_PASSWORD: password
      KC_HOSTNAME_URL: http://keycloak:8080
      KC_HOSTNAME_ADMIN_URL: http://keycloak:8080
      KEYCLOAK_IMPORT: /realm-export.json
    volumes:
      - ./docker/keycloak/realm-export.json:/realm-export.json
    ports:
      - "8080:8080"
    command:
      - start-dev
      - -Dkeycloak.import=/realm-export.json
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/health/ready" ]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - susconnect-network

  # Zookeeper for Kafka
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - susconnect-network

  # Apache Kafka Message Broker
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "9092:9092"
    healthcheck:
      test: kafka-broker-api-versions --bootstrap-server localhost:9092 || exit 1
      interval: 15s
      timeout: 10s
      retries: 5
    networks:
      - susconnect-network

  # PostgreSQL Database for Auth Service
  auth-service-db:
    image: postgres:15-alpine
    container_name: auth-service-db
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5431:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - susconnect-network

  # PostgreSQL Database for Triage Service
  triage-postgres:
    image: postgres:15-alpine
    container_name: triage-postgres
    environment:
      POSTGRES_DB: triage_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - susconnect-network

  # PostgreSQL Database for Appointment Service
  appointment-postgres:
    image: postgres:15-alpine
    container_name: appointment-postgres
    environment:
      POSTGRES_DB: appointment_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5433:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - susconnect-network

  # PostgreSQL Database for Medical Record Service
  medical-record-postgres:
    image: postgres:15-alpine
    container_name: medical-record-postgres
    environment:
      POSTGRES_DB: medical_record_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5434:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - susconnect-network

  # Redis for Caching and Sessions (Future)
  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - susconnect-network

  # ============================================================
  # MICROSERVICES
  # ============================================================

  # Service Registry (Eureka)
  service-registry:
    build:
      context: ./service-registry
      dockerfile: Dockerfile
    container_name: service-registry
    depends_on:
      - kafka
      - keycloak
    environment:
      SPRING_APPLICATION_NAME: service-registry
      SERVER_PORT: 8762
    ports:
      - "8762:8762"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8762/actuator/health" ]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - susconnect-network

  # API Gateway
  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: api-gateway
    depends_on:
      service-registry:
        condition: service_healthy
    environment:
      SPRING_APPLICATION_NAME: api-gateway
      SERVER_PORT: 8761
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://service-registry:8762/eureka/
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://keycloak:8080/realms/sus-connect
      JWT_ISSUER_URI: http://keycloak:8080/realms/sus-connect
      JWT_JWK_SET_URI: http://keycloak:8080/realms/sus-connect/protocol/openid-connect/certs
    ports:
      - "8761:8761"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8761/actuator/health" ]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - susconnect-network

  # Auth Service
  auth-service:
    build:
      context: .
      dockerfile: ./auth-service/Dockerfile
    container_name: auth-service
    depends_on:
      auth-service-db:
        condition: service_healthy
      redis:
        condition: service_healthy
      service-registry:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    environment:
      SPRING_APPLICATION_NAME: auth-service
      SPRING_DATASOURCE_URL: jdbc:postgresql://auth-service-db:5432/auth_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: password
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_FLYWAY_ENABLED: "true"
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://service-registry:8762/eureka/
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://keycloak:8080/realms/sus-connect
      KEYCLOAK_AUTH_SERVER_URL: http://keycloak:8080
      KEYCLOAK_REALM: sus-connect
      KEYCLOAK_RESOURCE: auth-service
      KEYCLOAK_CREDENTIALS_SECRET: auth-service-secret
      KEYCLOAK_PUBLIC_CLIENT_ID: frontend-client
      KEYCLOAK_ADMIN_USER: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "0:8080"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/actuator/health" ]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - susconnect-network

  # Triage Service
  triage-service:
    build:
      context: ./triagem-service
      dockerfile: Dockerfile
    container_name: triage-service
    depends_on:
      triage-postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      service-registry:
        condition: service_healthy
    environment:
      SPRING_APPLICATION_NAME: triage-service
      SERVER_PORT: 8201
      SPRING_DATASOURCE_URL: jdbc:postgresql://triage-postgres:5432/triage_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: password
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SPRING_FLYWAY_ENABLED: "true"
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://service-registry:8762/eureka/
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://keycloak:8080/realms/sus-connect
      JWT_ISSUER_URI: http://keycloak:8080/realms/sus-connect
    ports:
      - "8201:8201"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8201/actuator/health" ]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - susconnect-network

  # Appointment Service
  appointment-service:
    build:
      context: ./agendamento-service
      dockerfile: Dockerfile
    container_name: appointment-service
    depends_on:
      appointment-postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      service-registry:
        condition: service_healthy
    environment:
      SPRING_APPLICATION_NAME: appointment-service
      SERVER_PORT: 8202
      SPRING_DATASOURCE_URL: jdbc:postgresql://appointment-postgres:5432/appointment_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: password
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SPRING_FLYWAY_ENABLED: "true"
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://service-registry:8762/eureka/
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://keycloak:8080/realms/sus-connect
      JWT_ISSUER_URI: http://keycloak:8080/realms/sus-connect
    ports:
      - "8202:8202"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8202/actuator/health" ]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - susconnect-network

  # Medical Record Service
  medical-record-service:
    build:
      context: ./prontuario-service
      dockerfile: Dockerfile
    container_name: medical-record-service
    depends_on:
      medical-record-postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      service-registry:
        condition: service_healthy
    environment:
      SPRING_APPLICATION_NAME: medical-record-service
      SERVER_PORT: 8203
      SPRING_DATASOURCE_URL: jdbc:postgresql://medical-record-postgres:5432/medical_record_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: password
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SPRING_FLYWAY_ENABLED: "true"
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://service-registry:8762/eureka/
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://keycloak:8080/realms/sus-connect
      JWT_ISSUER_URI: http://keycloak:8080/realms/sus-connect
    ports:
      - "8203:8203"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8203/actuator/health" ]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - susconnect-network

networks:
  susconnect-network:
    driver: bridge

# Default PostgreSQL credentials for development:
# User: postgres
# Password: password
#
# Keycloak credentials for development:
# User: admin
# Password: admin
# Realm: sus-connect
#
# Endpoints:
# - API Gateway: http://localhost:8761
# - Eureka Console: http://localhost:8762
# - Keycloak Admin: http://localhost:8080
# - Triage Service: http://localhost:8201
# - Appointment Service: http://localhost:8202
# - Medical Record Service: http://localhost:8203
#
# To start services:
# docker-compose up -d
#
# To stop services:
# docker-compose down
