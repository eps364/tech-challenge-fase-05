services:
  appointment-postgres:
    image: postgres:15-alpine
    container_name: appointment-postgres
    restart: on-failure
    environment:
      POSTGRES_DB: appointment_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d appointment_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - appointment_postgres_data:/var/lib/postgresql/data
    networks:
      - susconnect-network

  appointment-service:
    build:
      context: .
      dockerfile: ./appointment-service/Dockerfile
    container_name: appointment-service
    restart: on-failure
    depends_on:
      appointment-postgres:
        condition: service_healthy
    environment:
      SPRING_APPLICATION_NAME: appointment-service
      SERVER_PORT: 8202
      SPRING_DATASOURCE_URL: jdbc:postgresql://appointment-postgres:5432/appointment_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: password
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SPRING_FLYWAY_ENABLED: "true"
    ports:
      - "8202:8202"
    networks:
      - susconnect-network

networks:
  susconnect-network:
    driver: bridge

volumes:
  appointment_postgres_data:
