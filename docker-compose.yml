name: tech-challenge-fase-05

services:
  # Infrastructure
  keycloak-postgres:
    image: postgres:15-alpine
    container_name: keycloak-postgres
    restart: on-failure
    environment:
      POSTGRES_DB: keycloak_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5430:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d keycloak_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - keycloak_postgres_data:/var/lib/postgresql/data
    networks:
      - susconnect-network

  keycloak:
    build:
      context: ./docker
      dockerfile: ./keycloak/Dockerfile
    container_name: keycloak
    restart: on-failure
    depends_on:
      keycloak-postgres:
        condition: service_healthy
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-postgres:5432/keycloak_db
      KC_DB_USERNAME: postgres
      KC_DB_PASSWORD: password
    command:
      - start-dev
      - --import-realm
      - --http-port=8080
    volumes:
      - ./docker/keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080 && echo -e 'GET /realms/master/.well-known/openid-configuration HTTP/1.1\\r\\nHost: localhost:8080\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q 'issuer'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s
    networks:
      - susconnect-network

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    restart: on-failure
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - susconnect-network

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    restart: on-failure
    depends_on:
      zookeeper:
        condition: service_started
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 2>/dev/null || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 40s
    networks:
      - susconnect-network

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: on-failure
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - susconnect-network

  auth-service-db:
    image: postgres:15-alpine
    container_name: auth-service-db
    restart: on-failure
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5431:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d auth_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - auth_service_db_data:/var/lib/postgresql/data
    networks:
      - susconnect-network

  triage-postgres:
    image: postgres:15-alpine
    container_name: triage-postgres
    restart: on-failure
    environment:
      POSTGRES_DB: triage_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d triage_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - triage_postgres_data:/var/lib/postgresql/data
    networks:
      - susconnect-network

  appointment-postgres:
    image: postgres:15-alpine
    container_name: appointment-postgres
    restart: on-failure
    environment:
      POSTGRES_DB: appointment_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d appointment_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - appointment_postgres_data:/var/lib/postgresql/data
    networks:
      - susconnect-network

  medical-record-postgres:
    image: postgres:15-alpine
    container_name: medical-record-postgres
    restart: on-failure
    environment:
      POSTGRES_DB: medical_record_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d medical_record_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - medical_record_postgres_data:/var/lib/postgresql/data
    networks:
      - susconnect-network

  # Java microservices
  config-server:
    build:
      context: .
      dockerfile: ./config-server/Dockerfile
    container_name: config-server
    restart: on-failure
    volumes:
      - ./config-repo:/config-repo:ro
    environment:
      SPRING_APPLICATION_NAME: config-server
      SERVER_PORT: 8888
      CONFIG_REPO_PATH: file:/config-repo
    ports:
      - "8888:8888"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8888/actuator/health || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - susconnect-network

  service-registry:
    build:
      context: .
      dockerfile: ./registry-service/Dockerfile
    container_name: service-registry
    restart: on-failure
    depends_on:
      kafka:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    environment:
      SPRING_APPLICATION_NAME: service-registry
      SERVER_PORT: 8762
    ports:
      - "8762:8762"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8762/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - susconnect-network

  api-gateway:
    build:
      context: .
      dockerfile: ./api-gateway/Dockerfile
    container_name: api-gateway
    restart: on-failure
    depends_on:
      config-server:
        condition: service_healthy
      service-registry:
        condition: service_healthy
    environment:
      SPRING_APPLICATION_NAME: api-gateway
      SERVER_PORT: 8761
      SPRING_CLOUD_CONFIG_URI: http://config-server:8888
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://service-registry:8762/eureka/
      JWT_ISSUER_URI: http://keycloak:8080/realms/sus-connect
      JWT_JWK_SET_URI: http://keycloak:8080/realms/sus-connect/protocol/openid-connect/certs
    ports:
      - "8761:8761"
    networks:
      - susconnect-network

  auth-service:
    build:
      context: .
      dockerfile: ./auth-service/Dockerfile
    container_name: auth-service
    restart: on-failure
    depends_on:
      auth-service-db:
        condition: service_healthy
      redis:
        condition: service_healthy
      config-server:
        condition: service_healthy
      service-registry:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    environment:
      SPRING_APPLICATION_NAME: auth-service
      SERVER_PORT: 0
      SPRING_DATASOURCE_URL: jdbc:postgresql://auth-service-db:5432/auth_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: password
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SPRING_FLYWAY_ENABLED: "true"
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_CLOUD_CONFIG_URI: http://config-server:8888
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://service-registry:8762/eureka/
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://keycloak:8080/realms/sus-connect
      KEYCLOAK_AUTH_SERVER_URL: http://keycloak:8080
      KEYCLOAK_REALM: sus-connect
      KEYCLOAK_RESOURCE: auth-service
      KEYCLOAK_CREDENTIALS_SECRET: auth-service-secret
      KEYCLOAK_PUBLIC_CLIENT_ID: frontend-client
      KEYCLOAK_ADMIN_USER: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    networks:
      - susconnect-network

  triage-service:
    build:
      context: .
      dockerfile: ./triage-service/Dockerfile
    container_name: triage-service
    restart: on-failure
    depends_on:
      triage-postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      config-server:
        condition: service_healthy
      service-registry:
        condition: service_healthy
    environment:
      SPRING_APPLICATION_NAME: triage-service
      SERVER_PORT: 0
      SPRING_DATASOURCE_URL: jdbc:postgresql://triage-postgres:5432/triage_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: password
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SPRING_FLYWAY_ENABLED: "true"
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_CLOUD_CONFIG_URI: http://config-server:8888
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://service-registry:8762/eureka/
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://keycloak:8080/realms/sus-connect
    networks:
      - susconnect-network

  appointment-service:
    build:
      context: .
      dockerfile: ./appointment-service/Dockerfile
    container_name: appointment-service
    restart: on-failure
    depends_on:
      appointment-postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      config-server:
        condition: service_healthy
      service-registry:
        condition: service_healthy
    environment:
      SPRING_APPLICATION_NAME: appointment-service
      SERVER_PORT: 0
      SPRING_DATASOURCE_URL: jdbc:postgresql://appointment-postgres:5432/appointment_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: password
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SPRING_FLYWAY_ENABLED: "true"
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_CLOUD_CONFIG_URI: http://config-server:8888
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://service-registry:8762/eureka/
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://keycloak:8080/realms/sus-connect
    networks:
      - susconnect-network

  medical-record-service:
    build:
      context: .
      dockerfile: ./medicalrecord-service/Dockerfile
    container_name: medical-record-service
    restart: on-failure
    depends_on:
      medical-record-postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      config-server:
        condition: service_healthy
      service-registry:
        condition: service_healthy
    environment:
      SPRING_APPLICATION_NAME: medical-record-service
      SERVER_PORT: 0
      SPRING_DATASOURCE_URL: jdbc:postgresql://medical-record-postgres:5432/medical_record_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: password
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SPRING_FLYWAY_ENABLED: "true"
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_CLOUD_CONFIG_URI: http://config-server:8888
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://service-registry:8762/eureka/
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://keycloak:8080/realms/sus-connect
    networks:
      - susconnect-network

networks:
  susconnect-network:
    driver: bridge

volumes:
  keycloak_postgres_data:
  auth_service_db_data:
  triage_postgres_data:
  appointment_postgres_data:
  medical_record_postgres_data:
