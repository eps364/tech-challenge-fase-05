spring:
  application:
    name: config-server
  profiles:
    active: native
  cloud:
    config:
      server:
        native:
          # In Docker, this path is mounted as a volume via docker-compose.
          # Locally (IDE / mvn spring-boot:run), it resolves to the config-repo/ folder
          # sibling of the config-server directory.
          search-locations: ${CONFIG_REPO_PATH:file:../config-repo}

server:
  port: ${SERVER_PORT:8888}

management:
  endpoints:
    web:
      exposure:
        include: health,info,env,refresh
  endpoint:
    health:
      show-details: always
