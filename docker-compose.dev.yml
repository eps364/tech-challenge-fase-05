# docker-compose.dev.yml - Development Overrides
# Usage: docker compose -f docker-compose.yml -f docker-compose.dev.yml up
#
# This file overrides production settings for faster development iteration:
# - Increases logging verbosity
# - Keeps critical infrastructure healthchecks (Keycloak, Kafka, DBs)
# - Disables healthchecks only for Java services for faster startup
# - Enables auto-reload where applicable

services:
  # Keep database healthchecks - critical for preventing startup failures
  # Databases start fast, healthchecks prevent data corruption issues
  
  # Keep Keycloak healthcheck - auth services depend on it being fully ready
  keycloak:
    healthcheck:
      # Reduce intervals for faster feedback in dev
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

  # Keep Kafka healthcheck - message consumers need it ready
  kafka:
    healthcheck:
      interval: 10s
      timeout: 5s
      retries: 3

  # Disable healthchecks for Java microservices - they retry connections
  config-server:
    healthcheck:
      disable: true
    environment:
      LOGGING_LEVEL_ROOT: INFO
      LOGGING_LEVEL_BR_COM_FIAP: DEBUG

  service-registry:
    # Keep dependency on healthy Keycloak to avoid connection errors
    depends_on:
      kafka:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck:
      disable: true
    environment:
      LOGGING_LEVEL_ROOT: INFO
      LOGGING_LEVEL_BR_COM_FIAP: DEBUG

  api-gateway:
    depends_on:
      - config-server
      - service-registry
    healthcheck:
      disable: true
    environment:
      LOGGING_LEVEL_ROOT: INFO
      LOGGING_LEVEL_BR_COM_FIAP: DEBUG
      LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_CLOUD_GATEWAY: DEBUG
      SPRING_CLOUD_CONFIG_URI: http://config-server:8888

  auth-service:
    depends_on:
      - auth-service-db
      - redis
      - config-server
      - service-registry
      - keycloak
    healthcheck:
      disable: true
    environment:
      LOGGING_LEVEL_ROOT: INFO
      LOGGING_LEVEL_BR_COM_FIAP: DEBUG
      LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_SECURITY: DEBUG
      SPRING_JPA_SHOW_SQL: "false"
      SPRING_JPA_PROPERTIES_HIBERNATE_FORMAT_SQL: "false"
      SPRING_CLOUD_CONFIG_URI: http://config-server:8888

  triage-service:
    depends_on:
      - triage-postgres
      - kafka
      - config-server
      - service-registry
    healthcheck:
      disable: true
    environment:
      LOGGING_LEVEL_ROOT: INFO
      LOGGING_LEVEL_BR_COM_FIAP: DEBUG
      SPRING_JPA_SHOW_SQL: "false"
      SPRING_JPA_PROPERTIES_HIBERNATE_FORMAT_SQL: "false"
      SPRING_CLOUD_CONFIG_URI: http://config-server:8888

  appointment-service:
    depends_on:
      - appointment-postgres
      - kafka
      - config-server
      - service-registry
    healthcheck:
      disable: true
    environment:
      LOGGING_LEVEL_ROOT: INFO
      LOGGING_LEVEL_BR_COM_FIAP: DEBUG
      SPRING_JPA_SHOW_SQL: "false"
      SPRING_JPA_PROPERTIES_HIBERNATE_FORMAT_SQL: "false"
      SPRING_CLOUD_CONFIG_URI: http://config-server:8888

  medical-record-service:
    depends_on:
      - medical-record-postgres
      - kafka
      - config-server
      - service-registry
    healthcheck:
      disable: true
    environment:
      LOGGING_LEVEL_ROOT: INFO
      LOGGING_LEVEL_BR_COM_FIAP: DEBUG
      SPRING_JPA_SHOW_SQL: "false"
      SPRING_JPA_PROPERTIES_HIBERNATE_FORMAT_SQL: "false"
      SPRING_CLOUD_CONFIG_URI: http://config-server:8888
