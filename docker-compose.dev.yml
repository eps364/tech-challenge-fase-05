# docker-compose.dev.yml - Development Overrides
# Usage: docker compose -f docker-compose.yml -f docker-compose.dev.yml up --watch
#
# This file overrides production settings for faster development iteration:
# - Mounts source code from host into the builder image (no rebuild needed)
# - Uses spring-boot:run for faster startup and hot restart
# - Disables healthchecks for Java services
# - Uses Docker Compose Watch (sync+restart) for file change detection

services:
  # Keep database healthchecks - critical for preventing startup failures
  # Databases start fast, healthchecks prevent data corruption issues

  # Keep Keycloak healthcheck - auth services depend on it being fully ready
  keycloak:
    healthcheck:
      # Reduce intervals for faster feedback in dev
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

  # Keep Kafka healthcheck - message consumers need it ready
  kafka:
    healthcheck:
      interval: 10s
      timeout: 15s
      retries: 10

  # Disable healthchecks for Java microservices - they retry connections
  config-server:
    build:
      target: builder
    entrypoint: []
    command:
      - bash
      - -c
      - "mvn install -N -DskipTests -Dspotless.skip=true -q && mvn install -pl common-lib -DskipTests -Dspotless.skip=true -q && mvn -f config-server/pom.xml spring-boot:run"
    healthcheck:
      disable: true
    volumes:
      - .:/workspace
      - ./config-repo:/config-repo:ro
      - m2-cache:/root/.m2
    environment:
      LOGGING_LEVEL_ROOT: INFO
      LOGGING_LEVEL_BR_COM_FIAP: DEBUG
      SPRING_DEVTOOLS_RESTART_ENABLED: "false"
      SPRING_PROFILES_ACTIVE: native,dev
      MAVEN_OPTS: -XX:+TieredCompilation -XX:TieredStopAtLevel=4 -Xms256m -Xmx512m
    develop:
      watch:
        - path: ./config-server/src
          action: sync+restart
          target: /workspace/config-server/src
        - path: ./common-lib/src
          action: sync+restart
          target: /workspace/common-lib/src

  service-registry:
    build:
      target: builder
    entrypoint: []
    command:
      - bash
      - -c
      - "mvn install -N -DskipTests -Dspotless.skip=true -q && mvn install -pl common-lib -DskipTests -Dspotless.skip=true -q && mvn -f registry-service/pom.xml spring-boot:run"
    depends_on:
      kafka:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck:
      disable: true
    volumes:
      - .:/workspace
      - m2-cache:/root/.m2
    environment:
      LOGGING_LEVEL_ROOT: INFO
      LOGGING_LEVEL_BR_COM_FIAP: DEBUG
      SPRING_PROFILES_ACTIVE: dev
      MAVEN_OPTS: -XX:+TieredCompilation -XX:TieredStopAtLevel=4 -Xms256m -Xmx512m
    develop:
      watch:
        - path: ./registry-service/src
          action: sync+restart
          target: /workspace/registry-service/src

  api-gateway:
    build:
      target: builder
    entrypoint: []
    command:
      - bash
      - -c
      - "mvn install -N -DskipTests -Dspotless.skip=true -q && mvn install -pl common-lib -DskipTests -Dspotless.skip=true -q && mvn -f api-gateway/pom.xml spring-boot:run"
    depends_on:
      - config-server
      - service-registry
    healthcheck:
      disable: true
    volumes:
      - .:/workspace
      - m2-cache:/root/.m2
    environment:
      LOGGING_LEVEL_ROOT: INFO
      LOGGING_LEVEL_BR_COM_FIAP: DEBUG
      LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_CLOUD_GATEWAY: DEBUG
      SPRING_CLOUD_CONFIG_URI: http://config-server:8888
      SPRING_PROFILES_ACTIVE: dev
      MAVEN_OPTS: -XX:+TieredCompilation -XX:TieredStopAtLevel=4 -Xms256m -Xmx512m
    develop:
      watch:
        - path: ./api-gateway/src
          action: sync+restart
          target: /workspace/api-gateway/src

  auth-service:
    build:
      target: builder
    entrypoint: []
    command:
      - bash
      - -c
      - "mvn install -N -DskipTests -Dspotless.skip=true -q && mvn install -pl common-lib -DskipTests -Dspotless.skip=true -q && mvn -f auth-service/pom.xml spring-boot:run"
    depends_on:
      - auth-service-db
      - redis
      - config-server
      - service-registry
      - keycloak
    healthcheck:
      disable: true
    volumes:
      - .:/workspace
      - m2-cache:/root/.m2
    environment:
      LOGGING_LEVEL_ROOT: INFO
      LOGGING_LEVEL_BR_COM_FIAP: DEBUG
      LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_SECURITY: DEBUG
      SPRING_JPA_SHOW_SQL: "false"
      SPRING_CLOUD_CONFIG_URI: http://config-server:8888
      SPRING_PROFILES_ACTIVE: dev
      MAVEN_OPTS: -XX:+TieredCompilation -XX:TieredStopAtLevel=4 -Xms256m -Xmx512m
    develop:
