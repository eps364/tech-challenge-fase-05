# docker-compose.dev.yml - Development Overrides
# Usage: docker compose -f docker-compose.yml -f docker-compose.dev.yml up
#
# This file overrides production settings for faster development iteration:
# - Increases logging verbosity
# - Keeps critical infrastructure healthchecks (Keycloak, Kafka, DBs)
# - Disables healthchecks only for Java services for faster startup
# - Enables auto-reload where applicable

services:
  # Keep database healthchecks - critical for preventing startup failures
  # Databases start fast, healthchecks prevent data corruption issues
  
  # Keep Keycloak healthcheck - auth services depend on it being fully ready
  keycloak:
    healthcheck:
      # Reduce intervals for faster feedback in dev
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

  # Keep Kafka healthcheck - message consumers need it ready
  kafka:
    healthcheck:
      interval: 10s
      timeout: 5s
      retries: 3

  # Disable healthchecks for Java microservices - they retry connections
  config-server:
    build:
      target: builder
    command: mvn -f config-server/pom.xml spring-boot:run -Dspring-boot.devtools.restart.enabled=true
    healthcheck:
      disable: true
    volumes:
      - ./config-repo:/config-repo:ro
      - m2-cache:/root/.m2
    environment:
      LOGGING_LEVEL_ROOT: INFO
      LOGGING_LEVEL_BR_COM_FIAP: DEBUG
      SPRING_DEVTOOLS_RESTART_ENABLED: "true"
      SPRING_DEVTOOLS_RESTART_POLL_INTERVAL: 2000
      SPRING_DEVTOOLS_RESTART_QUIET_PERIOD: 1000
      SPRING_PROFILES_ACTIVE: native,dev
      MAVEN_OPTS: -XX:+TieredCompilation -XX:TieredStopAtLevel=4 -Xms256m -Xmx512m
    develop:
      watch:
        - path: ./config-server/src/main/java
          action: sync+restart
          target: /workspace/config-server/src/main/java
        - path: ./config-server/src/main/resources
          action: sync+restart
          target: /workspace/config-server/src/main/resources

  service-registry:
    build:
      target: builder
    command: mvn -f registry-service/pom.xml spring-boot:run -Dspring-boot.devtools.restart.enabled=true
    # Keep dependency on healthy Keycloak to avoid connection errors
    depends_on:
      kafka:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck:
      disable: true
    volumes:
      - m2-cache:/root/.m2
    environment:
      LOGGING_LEVEL_ROOT: INFO
      LOGGING_LEVEL_BR_COM_FIAP: DEBUG
      SPRING_DEVTOOLS_RESTART_ENABLED: "true"
      SPRING_DEVTOOLS_RESTART_POLL_INTERVAL: 2000
      SPRING_DEVTOOLS_RESTART_QUIET_PERIOD: 1000
      SPRING_PROFILES_ACTIVE: dev
      MAVEN_OPTS: -XX:+TieredCompilation -XX:TieredStopAtLevel=4 -Xms256m -Xmx512m
    develop:
      watch:
        - path: ./registry-service/src/main/java
          action: sync+restart
          target: /workspace/registry-service/src/main/java
        - path: ./registry-service/src/main/resources
          action: sync+restart
          target: /workspace/registry-service/src/main/resources

  api-gateway:
    build:
      target: builder
    command: mvn -f api-gateway/pom.xml spring-boot:run -Dspring-boot.devtools.restart.enabled=true
    depends_on:
      - config-server
      - service-registry
    healthcheck:
      disable: true
    volumes:
      - m2-cache:/root/.m2
    environment:
      LOGGING_LEVEL_ROOT: INFO
      LOGGING_LEVEL_BR_COM_FIAP: DEBUG
      LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_CLOUD_GATEWAY: DEBUG
      SPRING_CLOUD_CONFIG_URI: http://config-server:8888
      SPRING_DEVTOOLS_RESTART_ENABLED: "true"
      SPRING_DEVTOOLS_RESTART_POLL_INTERVAL: 2000
      SPRING_DEVTOOLS_RESTART_QUIET_PERIOD: 1000
      SPRING_PROFILES_ACTIVE: dev
      MAVEN_OPTS: -XX:+TieredCompilation -XX:TieredStopAtLevel=4 -Xms256m -Xmx512m
    develop:
