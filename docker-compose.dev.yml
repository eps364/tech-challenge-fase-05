services:
  aps-prioritization-postgres:
    image: postgres:15-alpine
    container_name: aps-prioritization-postgres-dev
    restart: on-failure
    environment:
      POSTGRES_DB: aps_priority_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d aps_priority_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - aps_priority_postgres_dev_data:/var/lib/postgresql/data

volumes:
  aps_priority_postgres_dev_data:
